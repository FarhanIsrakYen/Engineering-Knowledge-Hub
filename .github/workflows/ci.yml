name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ekh_test
          POSTGRES_USER: ekh
          POSTGRES_PASSWORD: ekh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekh -d ekh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EKH_JWT_SECRET: test-only-jwt-secret-with-at-least-32-characters
      EKH_DATABASE_URL: postgresql+asyncpg://ekh:ekh@localhost:5432/ekh_test
      EKH_TEST_DATABASE_URL: postgresql+asyncpg://ekh:ekh@localhost:5432/ekh_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Apply migrations
        run: alembic upgrade head
      - name: Test
        run: pytest
