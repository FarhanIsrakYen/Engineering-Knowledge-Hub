[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-knowledge-hub"
version = "0.1.0"
description = "Multi-tenant knowledge platform for engineering teams"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "boto3>=1.35,<2.0",
    "celery[redis]>=5.6,<6.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "fastembed>=0.9,<1.0",
    "openai>=2.0,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "prometheus-client>=0.21,<1.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.19,<2.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3.0",
    "mypy>=1.15,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
ekh-evaluate = "app.cli.evaluate:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=56"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.$',
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
