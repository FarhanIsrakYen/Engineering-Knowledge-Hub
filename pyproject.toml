[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-knowledge-hub"
version = "0.1.0"
description = "Multi-tenant knowledge platform for engineering teams"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "boto3>=1.35,<2.0",
    "celery[redis]>=5.6,<6.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "fastembed>=0.9,<1.0",
    "openai>=2.0,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "PyJWT>=2.10,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.19,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real PostgreSQL database",
]
