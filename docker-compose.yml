services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      EKH_APP_NAME: ${EKH_APP_NAME:-Engineering Knowledge Hub}
      EKH_ENVIRONMENT: ${EKH_ENVIRONMENT:-development}
      EKH_DEBUG: ${EKH_DEBUG:-false}
      EKH_LOG_LEVEL: ${EKH_LOG_LEVEL:-INFO}
      EKH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ekh}:${POSTGRES_PASSWORD:-ekh}@db:5432/${POSTGRES_DB:-ekh}
      EKH_JWT_SECRET: ${EKH_JWT_SECRET:?EKH_JWT_SECRET must be set}
      EKH_ACCESS_TOKEN_EXPIRE_MINUTES: ${EKH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      EKH_REFRESH_TOKEN_EXPIRE_DAYS: ${EKH_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EKH_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      EKH_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      EKH_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EKH_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-engineering-knowledge-hub}
      EKH_OBJECT_STORAGE_REGION: ${EKH_OBJECT_STORAGE_REGION:-us-east-1}
      EKH_OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      EKH_DOCUMENT_MAX_UPLOAD_BYTES: ${EKH_DOCUMENT_MAX_UPLOAD_BYTES:-26214400}
      EKH_REDIS_URL: redis://redis:6379/0
      EKH_QUERY_RATE_LIMIT_REQUESTS: ${EKH_QUERY_RATE_LIMIT_REQUESTS:-30}
      EKH_QUERY_RATE_LIMIT_WINDOW_SECONDS: ${EKH_QUERY_RATE_LIMIT_WINDOW_SECONDS:-60}
      EKH_QUERY_EMBEDDING_CACHE_TTL_SECONDS: ${EKH_QUERY_EMBEDDING_CACHE_TTL_SECONDS:-3600}
      EKH_DOCUMENT_CHUNK_SIZE: ${EKH_DOCUMENT_CHUNK_SIZE:-1200}
      EKH_DOCUMENT_CHUNK_OVERLAP: ${EKH_DOCUMENT_CHUNK_OVERLAP:-150}
      EKH_EMBEDDING_MODEL: ${EKH_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EKH_EMBEDDING_DIMENSIONS: ${EKH_EMBEDDING_DIMENSIONS:-384}
      EKH_EMBEDDING_CACHE_DIR: /model-cache
      EKH_QDRANT_URL: http://qdrant:6333
      EKH_QDRANT_COLLECTION: ${EKH_QDRANT_COLLECTION:-document_chunks_v1}
      EKH_QDRANT_AUTO_INITIALIZE: "true"
      EKH_RETRIEVAL_MODE: ${EKH_RETRIEVAL_MODE:-hybrid}
      EKH_QUERY_REWRITING_ENABLED: ${EKH_QUERY_REWRITING_ENABLED:-false}
      EKH_RERANKING_ENABLED: ${EKH_RERANKING_ENABLED:-true}
      EKH_RERANKER_MODEL: ${EKH_RERANKER_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      EKH_RERANKER_CACHE_DIR: /model-cache
      EKH_RAG_CANDIDATE_COUNT: ${EKH_RAG_CANDIDATE_COUNT:-20}
      EKH_RAG_DEFAULT_TOP_K: ${EKH_RAG_DEFAULT_TOP_K:-5}
      EKH_CONVERSATION_HISTORY_MESSAGES: ${EKH_CONVERSATION_HISTORY_MESSAGES:-4}
      EKH_LLM_API_KEY: ${EKH_LLM_API_KEY:-}
      EKH_LLM_MODEL: ${EKH_LLM_MODEL:-gpt-5.5}
      EKH_LLM_BASE_URL: ${EKH_LLM_BASE_URL:-}
      EKH_LLM_TIMEOUT_SECONDS: ${EKH_LLM_TIMEOUT_SECONDS:-30}
      EKH_LLM_MAX_OUTPUT_TOKENS: ${EKH_LLM_MAX_OUTPUT_TOKENS:-800}
      EKH_RAG_MIN_SIMILARITY: ${EKH_RAG_MIN_SIMILARITY:-0.5}
      HF_HOME: /model-cache/huggingface
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - embedding_models:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      EKH_ENVIRONMENT: ${EKH_ENVIRONMENT:-development}
      EKH_LOG_LEVEL: ${EKH_LOG_LEVEL:-INFO}
      EKH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ekh}:${POSTGRES_PASSWORD:-ekh}@db:5432/${POSTGRES_DB:-ekh}
      EKH_JWT_SECRET: ${EKH_JWT_SECRET:?EKH_JWT_SECRET must be set}
      EKH_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      EKH_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      EKH_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EKH_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-engineering-knowledge-hub}
      EKH_OBJECT_STORAGE_REGION: ${EKH_OBJECT_STORAGE_REGION:-us-east-1}
      EKH_REDIS_URL: redis://redis:6379/0
      EKH_DOCUMENT_CHUNK_SIZE: ${EKH_DOCUMENT_CHUNK_SIZE:-1200}
      EKH_DOCUMENT_CHUNK_OVERLAP: ${EKH_DOCUMENT_CHUNK_OVERLAP:-150}
      EKH_EMBEDDING_MODEL: ${EKH_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EKH_EMBEDDING_DIMENSIONS: ${EKH_EMBEDDING_DIMENSIONS:-384}
      EKH_EMBEDDING_CACHE_DIR: /model-cache
      EKH_QDRANT_URL: http://qdrant:6333
      EKH_QDRANT_COLLECTION: ${EKH_QDRANT_COLLECTION:-document_chunks_v1}
      HF_HOME: /model-cache/huggingface
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - embedding_models:/model-cache
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekh}
      POSTGRES_USER: ${POSTGRES_USER:-ekh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  embedding_models:
  minio_data:
  postgres_data:
  qdrant_data:
  redis_data:
