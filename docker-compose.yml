services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      EKH_APP_NAME: ${EKH_APP_NAME:-Engineering Knowledge Hub}
      EKH_ENVIRONMENT: ${EKH_ENVIRONMENT:-development}
      EKH_DEBUG: ${EKH_DEBUG:-false}
      EKH_LOG_LEVEL: ${EKH_LOG_LEVEL:-INFO}
      EKH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ekh}:${POSTGRES_PASSWORD:-ekh}@db:5432/${POSTGRES_DB:-ekh}
      EKH_JWT_SECRET: ${EKH_JWT_SECRET:?EKH_JWT_SECRET must be set}
      EKH_ACCESS_TOKEN_EXPIRE_MINUTES: ${EKH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      EKH_REFRESH_TOKEN_EXPIRE_DAYS: ${EKH_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      EKH_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      EKH_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      EKH_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      EKH_OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-engineering-knowledge-hub}
      EKH_OBJECT_STORAGE_REGION: ${EKH_OBJECT_STORAGE_REGION:-us-east-1}
      EKH_OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      EKH_DOCUMENT_MAX_UPLOAD_BYTES: ${EKH_DOCUMENT_MAX_UPLOAD_BYTES:-26214400}
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekh}
      POSTGRES_USER: ${POSTGRES_USER:-ekh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
